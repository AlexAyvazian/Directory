name: Update county staff registries
on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
    inputs:
      state:
        description: 'Optional state abbreviation, e.g. GA or IN'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: county-registries
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate directory importer
        run: python -m unittest discover -s tests -p 'test_registry_*.py' -v
      - name: Refresh public county staff directories
        env:
          TARGET_STATE: ${{ github.event.inputs.state || '' }}
        run: |
          if [ -n "$TARGET_STATE" ]; then
            python scripts/refresh_registries.py --state "$TARGET_STATE"
          else
            python scripts/refresh_registries.py
          fi
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registries/current.json assets/js/registry-data.js
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public county staff directory snapshots"
            git push
          else
            echo "No directory changes"
          fi
