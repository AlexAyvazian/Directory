name: Validate registry integration
on:
  pull_request:
    paths:
      - 'scripts/refresh_registries.py'
      - 'scripts/import_research_batch.py'
      - 'assets/js/registry-*.js'
      - 'data/registries/**'
      - 'tests/test_registry_*.py'
      - 'tests/test_import_research_batch.py'
      - 'index.html'
      - 'assets/js/app.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - run: python -m compileall -q scripts/refresh_registries.py scripts/import_research_batch.py
      - run: python -m unittest discover -s tests -p 'test_registry_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_import_research_batch.py' -v
      - run: |
          node --check assets/js/registry-overlay.js
          node --check assets/js/app.js
