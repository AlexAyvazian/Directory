name: Validate registry integration
on:
  pull_request:
    paths:
      - 'scripts/refresh_registries.py'
      - 'scripts/import_research_batch.py'
      - 'scripts/discover_my_half.py'
      - 'scripts/scan_my_half_staff_pages.py'
      - 'tests/test_scan_my_half.py'
      - 'data/discovery/**'
      - 'tests/test_discover_my_half.py'
      - 'data/imports/**'
      - 'assets/js/registry-*.js'
      - 'data/registries/**'
      - 'tests/test_registry_*.py'
      - 'tests/test_import_research_batch.py'
      - 'index.html'
      - 'assets/js/app.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - run: python -m compileall -q scripts/refresh_registries.py scripts/import_research_batch.py scripts/discover_my_half.py scripts/scan_my_half_staff_pages.py
      - run: python -m unittest discover -s tests -p 'test_registry_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_import_research_batch.py' -v
      - run: python -m unittest discover -s tests -p 'test_discover_my_half.py' -v
      - run: python -m unittest discover -s tests -p 'test_scan_my_half.py' -v
      - name: Full county research import smoke test
        run: |
          python scripts/import_research_batch.py data/imports/claude-ga-in-2026-10-13
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/registries/research-batch.json").read_text())
          assert len(r["coverage"]) == 251, len(r["coverage"])
          assert len(r["changes"]) == 134, len(r["changes"])
          assert len(r["contacts"]) >= 153, len(r["contacts"])
          assert len(r["sources"]) >= 77, len(r["sources"])
          assert sum(c.get("email")!="" and c.get("contactType")=="person" for c in r["contacts"]) >= 73
          PY
      - run: |
          node --check assets/js/registry-overlay.js
          node --check assets/js/app.js
