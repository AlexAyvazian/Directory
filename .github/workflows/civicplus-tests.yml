name: CivicPlus crawler and PostgreSQL import tests
on:
  pull_request:
    paths:
      - 'scripts/*civicplus*'
      - 'tests/*civicplus*'
      - 'server/*schema.sql'
      - '.github/workflows/civicplus-tests.yml'
  push:
    paths:
      - 'scripts/*civicplus*'
      - 'tests/*civicplus*'
      - 'server/*schema.sql'
      - '.github/workflows/civicplus-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-civicplus.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
        env:
          CIVICPLUS_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
