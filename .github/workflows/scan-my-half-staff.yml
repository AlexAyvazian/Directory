name: Scan public county HR and staff pages (25 states)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/scan_my_half_staff_pages.py'
      - '.github/workflows/scan-my-half-staff.yml'
  workflow_run:
    workflows: ['Discover county government domains (25 states)']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: county-staff-page-discovery-my-half
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate site discovery rules
        run: python -m unittest discover -s tests -p 'test_scan_my_half.py' -v
      - name: Parallel permitted staff page scan
        run: python scripts/scan_my_half_staff_pages.py --workers 24
      - name: Persist public page discovery leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/my_half_staff_page_leads.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh county employee directory page leads"
            git push
          fi
