name: Discover county government domains (25 states)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_my_half.py'
      - '.github/workflows/discover-my-half.yml'
  schedule:
    - cron: '11 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: my-half-domain-discovery
  cancel-in-progress: false
jobs:
  match-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check safe county matching
        run: python -m unittest discover -s tests -p 'test_discover_my_half.py' -v
      - name: Match bulk government domain registrations
        run: python scripts/discover_my_half.py
      - name: Persist candidate discovery output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/my_half_domain_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh county government domain candidates (25 states)"
            git push
          fi
