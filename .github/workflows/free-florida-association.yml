name: Refresh free Florida county association directory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_free_association_fl.py'
      - '.github/workflows/free-florida-association.yml'
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: free-florida-county-directory
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate source-only extraction rules
        run: python -m unittest discover -s tests -p 'test_import_free_association_fl.py' -v
      - name: Read Florida public HR purchasing and risk listings
        run: python scripts/import_free_association_fl.py --max-pages 12 --delay 2
      - name: Persist sourced contacts for the Atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/fl_association_staff.json assets/js/fl-association-contacts.js
          if ! git diff --cached --quiet; then
            git commit -m "data: update free Florida county HR procurement and risk directory"
            git push
          fi
